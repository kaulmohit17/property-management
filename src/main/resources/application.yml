spring:
  batch:
    job:
      enabled: false
  application:
    name: property-management
  data:
    mongodb:
      uri: mongodb://localhost:27017/local
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher


management:
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
    info:
      enabled: true


logging:
  level:
    root: INFO
    com.tsc.propertymanagement: debug
    org.springframework: INFO

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
